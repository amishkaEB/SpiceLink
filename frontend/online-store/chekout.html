<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - SpiceCraft</title>
  <link rel="stylesheet" href="../../assets/css/online_store_css/checkout.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
  <div class="nav-left">
    <h1 class="logo">Spice Emporium</h1>
  </div>

  <nav class="nav-center">
    <a href="#">Home</a>
    <a href="#">Exotic Spices</a>
    <a href="#">Herbs</a>
    <a href="#">Blends</a>
    <a href="#">Gifts</a>
  </nav>

  <div class="nav-right">
    <input type="text" placeholder="Search spices..." class="search-bar">
    <a href="cart.html" class="cart-link">🛒</a>
    <img src="../../assets/images/user_profile.png" alt="User" class="profile-img">
  </div>
</header>


  <!-- Checkout -->
  <main class="checkout">
    <div class="checkout-container">
      <!-- Left side: form -->
      <div class="checkout-form">
        <h2>1. Customer Information</h2>
        <form>
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required>

          <label>Shipping Address</label>
          <input type="text" placeholder="123 Spice Lane, Flavor Town" required>

          <label>Contact Number</label>
          <input type="tel" placeholder="+1 (555) 123-4567" required>

          <h2>2. Payment Method</h2>
          <div class="payment-method">
            <label>
              <input type="radio" name="payment" checked> Cash on Delivery
            </label>
            <label>
              <input type="radio" name="payment"> Bank Transfer
            </label>
          </div>
        </form>
      </div>

      <!-- Right side: order summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <ul>
          <li>Cinnamon Sticks x 2 <span>$10.00</span></li>
          <li>Turmeric Powder x 1 <span>$5.00</span></li>
          <li>Saffron Threads x 1 <span>$20.00</span></li>
        </ul>
        <p>Subtotal <span>$35.00</span></p>
        <p>Shipping <span>$5.00</span></p>
        <hr>
        <h4>Total <span>$40.00</span></h4>
        <button class="place-order">Place Order</button>
      </div>
    </div>
  </main>

</body>
</html>
